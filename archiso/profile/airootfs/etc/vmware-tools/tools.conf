# Désactive la synchronisation d'horloge intégrée de VMware Tools -
# chronyd (voir packages.x86_64/services-systemd.conf) est déjà activé et
# gère la synchro NTP. Les deux mécanismes actifs en même temps se battent
# pour ajuster l'horloge (confirmé en conditions réelles sur une VM
# VMware : "System clock interference detected (another NTP client?)"
# dans les logs chronyd, horloge sautant toutes les ~30s), ce qui perturbe
# suffisamment le système pour faire planter en boucle le processus
# backend de sssd (regardé via son propre watchdog) - cassant
# l'authentification Kerberos/AD, très sensible aux écarts d'horloge.
# Voir docs/AD-JOIN-MODULE.md.
#
# Fichier lu par vmtoolsd (paquet open-vm-tools, voir packages.x86_64) -
# sans effet si la machine ne tourne pas sous VMware.
[timesync]
disable = TRUE
