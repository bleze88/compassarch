# Active les services nécessaires sur le système installé.
# "mandatory: true" fait échouer l'installation si le service n'existe pas
# sur la cible (utile pour détecter un paquet manquant dans packages.x86_64).
---
services:
    - name: "NetworkManager"
      mandatory: true
    - name: "sddm"
      mandatory: true
    - name: "sssd"
      mandatory: true
    - name: "chronyd"
      mandatory: true

targets: []

disable:
    - name: "pacman-init"
      mandatory: false
    - name: "choose-mirror"
      mandatory: false

disable-targets: []

# systemd-timesyncd est activé par défaut sur Arch et tourne en parallèle
# de chronyd (déjà activé ci-dessus, nécessaire pour Kerberos/AD) si on ne
# le désactive pas explicitement - les deux essaient de synchroniser
# l'horloge via NTP en même temps, se marchant dessus. Confirmé en
# conditions réelles : chronyd loggait "System clock interference
# detected (another NTP client?)" en continu, et l'horloge instable
# faisait planter en boucle le backend sssd (watchdog, toutes les ~30s),
# cassant l'authentification AD - même symptôme et même classe de bug que
# le conflit avec la synchro horloge VMware Tools (voir
# docs/AD-JOIN-MODULE.md), simplement une deuxième source différente du
# même problème. "mask" plutôt que "disable" seul : empêche aussi un
# démarrage déclenché indirectement (dépendance d'un autre service), pas
# seulement au boot normal.
mask:
    - name: "systemd-timesyncd.service"
      mandatory: false
