# Journal persistant sur disque (RAM uniquement par défaut sur Arch) - un
# redémarrage forcé après un plantage (écran noir, freeze) perd sinon tous
# les logs du démarrage incriminé, empêchant tout diagnostic après coup.
# Confirmé en conditions réelles : "Specifying boot ID or boot offset has
# no effect, no persistent journal was found" après un plantage nécessitant
# un redémarrage forcé pendant le débogage de l'intégration AD.
[Journal]
Storage=persistent
