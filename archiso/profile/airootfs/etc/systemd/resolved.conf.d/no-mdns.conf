# Désactive le mDNS de systemd-resolved. De nombreux domaines Active
# Directory historiques utilisent le suffixe ".local" (convention héritée
# de Windows Server 2000/2003) - or ".local" est réservé au mDNS
# (RFC 6762). Avec le mDNS activé (comportement par défaut), toute
# résolution DNS d'un tel domaine déclenche EN PLUS une requête mDNS
# parallèle qui traîne plusieurs secondes avant d'abandonner faute de
# réponse, ralentissant/déstabilisant les opérations Kerberos/LDAP
# (négociation GSSAPI anormalement longue observée en conditions
# réelles). Un poste joint à un domaine AD n'a normalement pas besoin du
# mDNS (découverte réseau local type imprimantes/AirPlay) ; sans effet
# sur Avahi, qui est un service mDNS séparé. Voir docs/AD-JOIN-MODULE.md.
[Resolve]
MulticastDNS=no
